###############
# General
###############
logLevel: info

###############
# Auth
###############
# HTTP 웹훅으로 백엔드가 스트림 토큰을 검증
# 클라이언트는 엔드포인트에 ?token=<auth_token> 쿼리로 접근
authMethod: http
authHTTPAddress: http://host.docker.internal:3000/streams/mediamtx-auth

###############
# API
###############
api: yes
apiAddress: :9997

###############
# RTSP
###############
rtsp: yes
rtspAddress: :8554

###############
# HLS
###############
hls: yes
hlsAddress: :8888

###############
# WebRTC
###############
webrtc: yes
webrtcAddress: :8889

###############
# Path defaults
###############
pathDefaults:
  sourceOnDemand: yes
