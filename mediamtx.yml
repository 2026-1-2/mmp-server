###############
# General
###############
logLevel: info

###############
# Auth
###############
authInternalUsers:
  - user: any
    permissions:
      - action: api
      - action: publish
      - action: read
      - action: playback

###############
# API
###############
api: yes
apiAddress: :9997

###############
# RTSP
###############
rtsp: yes
rtspAddress: :8554

###############
# HLS
###############
hls: yes
hlsAddress: :8888

###############
# WebRTC
###############
webrtc: yes
webrtcAddress: :8889

###############
# Path defaults
###############
pathDefaults:
  sourceOnDemand: yes
