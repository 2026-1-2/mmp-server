<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>MMP Stream Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; padding: 20px; }
    h1 { margin-bottom: 20px; }
    .channel { margin-bottom: 40px; border-top: 1px solid #333; padding-top: 20px; }
    h2 { font-size: 1.1rem; margin-bottom: 12px; }
    h3 { font-size: 0.9rem; color: #aaa; margin: 12px 0 6px; }
    video { display: block; background: #000; }
    .vod-list { list-style: none; padding: 0; }
    .vod-list li { margin: 4px 0; }
    .vod-list a { color: #4fc3f7; text-decoration: none; }
    .vod-list a:hover { text-decoration: underline; }
    .status { font-size: 0.8rem; color: #888; margin-top: 4px; }
    .error { color: #f44336; }
  </style>
</head>
<body>
  <h1>MMP Stream Player</h1>
  <div id="channels"><p>채널 목록 로딩 중...</p></div>

  <script>
    async function loadChannels() {
      let channels;
      try {
        const res = await fetch('/streams');
        channels = await res.json();
      } catch {
        document.getElementById('channels').innerHTML =
          '<p class="error">서버에 연결할 수 없습니다.</p>';
        return;
      }

      if (!channels.length) {
        document.getElementById('channels').innerHTML =
          '<p>채널 없음 — recordings/cam1/live/ 또는 recordings/cam1/vod/ 폴더를 만들고 파일을 추가하세요.</p>';
        return;
      }

      const container = document.getElementById('channels');
      container.innerHTML = '';

      for (const ch of channels) {
        const div = document.createElement('div');
        div.className = 'channel';
        div.innerHTML = `<h2>${ch.channelId}</h2>`;

        // ── Live ──────────────────────────────────
        if (ch.live) {
          div.innerHTML += `<h3>라이브 (HLS)</h3>`;
          const video = document.createElement('video');
          video.controls = true;
          video.width = 720;
          video.autoplay = true;
          video.muted = true;
          div.appendChild(video);

          const statusEl = document.createElement('p');
          statusEl.className = 'status';
          div.appendChild(statusEl);

          if (Hls.isSupported()) {
            const hls = new Hls({ liveSyncDurationCount: 3, debug: false });
            hls.loadSource(ch.live.hlsUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
              video.play().catch(() => {});
              statusEl.textContent = 'HLS 연결됨';
            });
            hls.on(Hls.Events.ERROR, (_, data) => {
              if (data.fatal) {
                statusEl.textContent = `오류: ${data.details} — 5초 후 재시도`;
                setTimeout(() => hls.loadSource(ch.live.hlsUrl), 5000);
              }
            });
          } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = ch.live.hlsUrl;
            video.play().catch(() => {});
            statusEl.textContent = 'Safari 네이티브 HLS';
          }
        }

        // ── VOD ───────────────────────────────────
        if (ch.vod) {
          div.innerHTML += `<h3>VOD (MP4)</h3>`;
          try {
            const r = await fetch(ch.vod.listUrl);
            const files = await r.json();
            if (files.length === 0) {
              div.innerHTML += '<p class="status">VOD 파일 없음</p>';
            } else {
              const ul = document.createElement('ul');
              ul.className = 'vod-list';
              for (const f of files) {
                ul.innerHTML += `<li><a href="${f.url}" target="_blank">${f.filename}</a></li>`;
              }
              div.appendChild(ul);
            }
          } catch {
            div.innerHTML += '<p class="error">VOD 목록 로드 실패</p>';
          }
        }

        container.appendChild(div);
      }
    }

    loadChannels();
  </script>
</body>
</html>
