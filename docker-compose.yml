services:
  mysql:
    image: mysql:8.0
    container_name: mmp-mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-30012}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mmp_db}
      MYSQL_USER: ${DB_USERNAME:-mmp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-asdf}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-asdf}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"   # RTSP
      - "8888:8888"   # HLS
      - "8889:8889"   # WebRTC
      - "8189:8189/udp" # WebRTC UDP
      - "9997:9997"   # REST API
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

volumes:
  mysql_data:
