services:
  api:
    build: .
    container_name: mmp-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      DATABASE_URL: mysql://${DB_USERNAME:-mmp}:${DB_PASSWORD:-asdf}@mysql:3306/${DB_DATABASE:-mmp_db}
      MEDIAMTX_URL: http://mediamtx:9997
    depends_on:
      mysql:
        condition: service_healthy
      mediamtx:
        condition: service_started

  mysql:
    image: mysql:8.0
    container_name: mmp-mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-30012}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mmp_db}
      MYSQL_USER: ${DB_USERNAME:-mmp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-asdf}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-asdf}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-asdf}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"     # RTSP
      - "8888:8888"     # HLS
      - "8889:8889"     # WebRTC
      - "8189:8189/udp" # WebRTC UDP
      - "9997:9997"     # REST API
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mysql_data:
